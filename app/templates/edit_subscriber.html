{% extends 'base.html' %}

{% block title %}Edit Subscriber{% endblock %}

{% block content %}
    <h1 class="h2">Edit Subscriber</h1>

    <div class="card">
        <div class="card-body">
            <form method="POST" action="{{ url_for('edit_subscriber', subscriber_id=subscriber.id) }}">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ subscriber.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="whatsapp_number" class="form-label">WhatsApp Number</label>
                    <input type="text" class="form-control" id="whatsapp_number" name="whatsapp_number" value="{{ subscriber.whatsapp_number }}" required>
                </div>
                <div class="mb-3">
                    <label for="state" class="form-label">State</label>
                    <input type="text" class="form-control" id="state" name="state" value="{{ subscriber.state or '' }}">
                </div>
                 <div class="mb-3">
                    <label for="status" class="form-label">Status</label>
                    <select class="form-select" id="status" name="status">
                        <option value="Active" {% if subscriber.status == 'Active' %}selected{% endif %}>Active</option>
                        <option value="Unsubscribed" {% if subscriber.status == 'Unsubscribed' %}selected{% endif %}>Unsubscribed</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('subscribers') }}" class="btn btn-secondary">Cancel</a>
            </form>
        </div>
    </div>
{% endblock %}
